name: Daily Post & Deploy

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 UTC 22:00 = JST 07:00
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write           # main と gh-pages へのプッシュに必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. リポジトリをチェックアウト ────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. state.json をキャッシュから復元 ──────────────────────────
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: scripts/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      # ── 3. Python セットアップ & 記事生成 ───────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Generate articles
        working-directory: scripts
        env:
          AMAZON_ACCESS_KEY:    ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:    ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          MOCK_MODE:            "true"
          ARTICLES_PER_DAY:     "3"
          FORCE_RUN:            ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
        run: python main.py

      # ── 4. アソシエイトタグを全記事に適用 ──────────────────────────
      - name: Fix associate tags
        run: |
          find content/posts -name "*.md" | xargs sed -i "s|tag=yourstore-22|tag=mirainikibouw-22|g"
          echo "アソシエイトタグを mirainikibouw-22 に置換しました"

      # ── 5. 生成記事を main ブランチにコミット ────────────────────────
      - name: Commit new articles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --cached --quiet; then
            echo "新規記事なし。スキップ。"
          else
            git commit -m "chore: add articles $(date +'%Y-%m-%d')"
            git push origin main
          fi

      # ── 5. Hugo セットアップ & ビルド ────────────────────────────────
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      # ── 6. GitHub Pages にデプロイ ───────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: "chore: auto deploy $(date +'%Y-%m-%d')"

      # ── 7. ログをアーティファクトに保存 ─────────────────────────────
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_number }}
          path: scripts/affiliate_bot.log
          retention-days: 14
